# Choose the instrument: 'batse' or 'swift' (without ' ')
# instrument = batse
instrument = swift

# Number of GRB LCs to generate
N_grb = 10000

# Show an on-screen progress-bar window while generating (needs a display;
# set to false for headless/background runs)
gui_progress = false

# Swift/BAT (v36, bazzanini+24 paper)
mu      = 1.34
# mu0     = 1.16   # Bazzanini-calibrated value; commented out for the mu0=10 experiment (REPORT.md, new section)
mu0     = 10
alpha   = 2.53
delta1  = -0.75
delta2  = 0.27
tau_min = 0.03
tau_max = 56.8


